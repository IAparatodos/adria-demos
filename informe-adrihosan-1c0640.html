<title>Adrihosan · acceso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--deep:#102e35;--brand:#3f6f7b;--accent:#4dd2d0;--ink:#102e35;--muted:#6f878c;--line:#dde6e7;--bg:#f5f8f8;--surface:#fff;--crit:#d03b3b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--deep);font-family:Poppins,system-ui,sans-serif;color:var(--ink);padding:24px 16px}
form{background:var(--surface);border-radius:14px;padding:28px 26px;width:100%;max-width:360px;display:grid;gap:14px}
.eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600;margin:0}
h1{font-size:22px;margin:0;line-height:1.2}
p.s{margin:0;color:var(--muted);font-size:13.5px}
label{display:grid;gap:5px;font-size:13px;font-weight:500}
input[type=text],input[type=password]{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--brand)}
.rem{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:15px;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--crit);font-size:13px;min-height:1.2em;margin:0}
</style></head><body>

  <button id="b" type="submit">Entrar</button>

</form>

  return crypto.subtle.deriveKey({name:'PBKDF2', salt:dec(BOX.salt), iterations:BOX.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function open_(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(BOX.iv)}, key, dec(BOX.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}

    if (saved){ const key = await crypto.subtle.importKey('raw', dec(saved), 'AES-GCM', true, ['decrypt']); await open_(key); return; }

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Comprobando…'; e.textContent = '';
  try {
    const key = await keyFrom(document.getElementById('u').value, document.getElementById('p').value);
    const remember = document.getElementById('r').checked;
    const raw = await crypto.subtle.exportKey('raw', key);
    await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(BOX.iv)}, key, dec(BOX.ct));

    await open_(key);
  } catch(err){
    e.textContent = 'Usuario o contraseña incorrectos.';
    b.disabled = false; b.textContent = 'Entrar';
  }
});
